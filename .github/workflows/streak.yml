name: Update GitHub Streak

on:
  repository_dispatch:
    types: [profile_update]
  workflow_dispatch:
  schedule:`r`n    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "profile/streak.svg"
      - ".github/workflows/streak.yml"

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate native GitHub contribution stats
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          if git diff --cached --quiet -- profile/streak.svg; then
            echo "No stats changes."
            exit 0
          fi
          git commit -m "chore: update GitHub contribution stats"
          git push

