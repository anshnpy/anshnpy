<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="495"
     height="195"
     viewBox="0 0 495 195"
     role="img"
     aria-label="anshnpy GitHub contribution statistics">

  <defs>
    <style>
      @keyframes fadein {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .fade {
        animation: fadein .5s ease forwards;
      }

      text {
        font-family: Segoe UI, Ubuntu, sans-serif;
      }
    </style>
  </defs>

  <rect width="495" height="195" rx="6" fill="#0D1117"/>

  <line x1="165" y1="28" x2="165" y2="170"
        stroke="#1F2937" opacity=".35"/>

  <line x1="330" y1="28" x2="330" y2="170"
        stroke="#1F2937" opacity=".35"/>

  <g text-anchor="middle" class="fade">
    <text x="82.5" y="80"
          fill="#F5F7FA"
          font-size="28"
          font-weight="700">196</text>

    <text x="82.5" y="116"
          fill="#E5E7EB"
          font-size="14">Total Contributions</text>

    <text x="82.5" y="146"
          fill="#94A3B8"
          font-size="12">Last 12 months</text>
  </g>

  <g text-anchor="middle" class="fade">
    <circle cx="247.5" cy="71"
            r="40"
            fill="none"
            stroke="#00B7FF"
            stroke-width="5"/>

    <text x="247.5" y="80"
          fill="#F5F7FA"
          font-size="28"
          font-weight="700">20</text>

    <text x="247.5" y="140"
          fill="#00B7FF"
          font-size="14"
          font-weight="700">Current Streak</text>

    <text x="247.5" y="166"
          fill="#94A3B8"
          font-size="12">GitHub contribution days</text>
  </g>

  <g text-anchor="middle" class="fade">
    <text x="412.5" y="80"
          fill="#F5F7FA"
          font-size="28"
          font-weight="700">20</text>

    <text x="412.5" y="116"
          fill="#E5E7EB"
          font-size="14">Longest Streak</text>

    <text x="412.5" y="146"
          fill="#94A3B8"
          font-size="12">GitHub contribution days</text>
  </g>

</svg>
